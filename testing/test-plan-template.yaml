# Test Plan — [Project Name]
# This is the single source of truth for what's tested, how, and what passed.
# The AI reads this at the start of every /build session to derive the position.
# You edit test status by reporting results; the AI records them.

# ────────────────────────── Capabilities ──────────────────────────
# What the operator can do (available: yes) vs. what can't be done (available: no).
# A test needing available: no is "not done", not "failed".
capabilities:
  # --- Manual capabilities (you can do these) ---
  flash-local-usb:
    what:      "Flash firmware to the ESP32 via local USB"
    available: yes
    tier:      manual

  serial-read:
    what:      "Read serial output at 115200 baud"
    available: yes
    tier:      manual

  button-press:
    what:      "Press BOOT and RESET buttons"
    available: yes
    tier:      manual

  power-cycle:
    what:      "Power-cycle the device (unplug/plug USB)"
    available: yes
    tier:      manual

  wifi-create-ap:
    what:      "Create a WiFi AP with known SSID/password using a phone or second device"
    available: yes
    tier:      manual

  ble-scan:
    what:      "Scan for BLE advertisements using a phone app"
    available: yes
    tier:      manual

  # --- Automated capabilities (CI handles these) ---
  host-tests:
    what:      "Run pytest host test suite"
    available: yes
    tier:      host

  ci-build:
    what:      "Build firmware via GitHub Actions"
    available: yes
    tier:      host

  # --- Limitations (cannot be done without testbench) ---
  wifi-outage:
    what:      "Stop and restart the AP on demand"
    available: no
    consequence: "WiFi recovery fault-injection tests are excluded"

  rf-injection:
    what:      "Inject RF at 433 MHz"
    available: no
    consequence: "RF receiver tests are excluded"

  mqtt-broker-control:
    what:      "Start/stop/restart MQTT broker on demand"
    available: no
    consequence: "MQTT broker fault-injection tests are excluded"

  automated-gpio:
    what:      "Toggle GPIO pins programmatically"
    available: no
    consequence: "Automatic GPIO fault-injection tests are excluded"

---
# ────────────────────────── Debugging Agenda ──────────────────────────
# Project-side parts that have never been observed working HERE.
# Each item: what it is, why unproven, how it will be proven.
# Commissioning burns this list to empty.
debugging_agenda:
  - part: "ESP32 board (first flash)"
    unproven_because: "never powered on in this setup"
    proven_by: "serial output shows boot marker after flash"
  - part: "UART serial connection"
    unproven_because: "never captured serial output"
    proven_by: "idf.py monitor shows output at 115200 baud"

---
# ────────────────────────── Journey Tests ──────────────────────────
# The gate for every hardware session. While these fail, later results
# are unreadable — a dozen reds, one cause.
# Write one test per step of the standard run.
journey:
  - id: JRN-01
    name: "Boot and print marker"
    kind: standard
    tier: target
    wave: 1
    verifies: []
    impl: "firmware/main/main.c::app_main"  # the marker print
    status: not_done
    steps:
      1: "Flash the latest firmware to the ESP32"
      2: "Open serial terminal at 115200 baud"
      3: "Power-cycle the device"
    expected:
      - "Serial shows: BOOT: starting"
      - "Serial shows: alive 1" within 2 seconds
    prohibited:
      - "No output at all"
      - "Boot loop (repeated resets)"
    operator_report_fields:
      - "exact serial output after power-cycle"
      - "did you see 'alive 1'? (yes/no)"
      - "if no, what did you see?"

  - id: JRN-02
    name: "Connect to WiFi"
    kind: standard
    tier: target
    wave: 1
    verifies: [FR-7.1]
    impl: "firmware/main/wifi_manager.c::wifi_connect"
    status: not_done
    steps:
      1: "Ensure the test AP 'TestNet-XXXX' is broadcasting"
      2: "Flash firmware"
      3: "Power-cycle and wait 30 seconds"
    expected:
      - "WIFI: connected to TestNet-XXXX"
      - "IP: 192.168.4.x"
    prohibited:
      - "WIFI: failed"
      - "WIFI: timeout"
    operator_report_fields:
      - "exact serial output (lines containing WIFI)"
      - "connection success? (yes/no)"
      - "time to connect (seconds)"

---
# ────────────────────────── Test Suite ──────────────────────────
# All tests, organized by area. The AI walks these per requirement
# during /build, in the chain: contract → declared → executable → code →
# build → you flash/test → record → green.
tests:
  # ┌─────────────────────────────────────────────────────────────┐
  # │  Host tier — automated, runs in CI                           │
  # └─────────────────────────────────────────────────────────────┘

  host:
    - id: TC-LOGIC-01
      name: "Layout table maps all required characters"
      kind: standard
      tier: host
      wave: 1
      verifies: [FR-5.2]
      impl: "tests/host/test_layout.py::test_all_chars_mapped"
      status: not_done

    - id: TC-LOGIC-02
      name: "Report builder produces valid 8-byte HID report"
      kind: standard
      tier: host
      wave: 1
      verifies: [FR-5.1, FR-8.1]
      impl: "tests/host/test_report.py::test_valid_report"
      status: not_done

  # ┌─────────────────────────────────────────────────────────────┐
  # │  Target tier — you flash and observe serial                  │
  # └─────────────────────────────────────────────────────────────┘

  target:
    - id: TC-WIFI-01
      name: "Device connects to the test AP"
      kind: standard
      tier: target
      wave: 1
      verifies: [FR-7.1]
      impl: "firmware/main/wifi_manager.c"
      status: not_done
      steps:
        1: "Create AP 'TestNet-XXXX' with password 'testtest'"
        2: "Flash firmware to ESP32"
        3: "Power-cycle the device"
        4: "Wait 30 seconds"
      expected:
        - "Serial shows: WIFI: connected to TestNet-XXXX"
        - "Serial shows: IP: assigned"
      prohibited:
        - "WIFI: failed"
        - "WIFI: timeout"
      operator_report_fields:
        - "first 5 serial lines after boot"
        - "WIFI connection message (exact text)"
        - "connection success? (yes/no)"
        - "seconds from boot to connection"

    - id: TC-BLE-01
      name: "Device advertises HID service"
      kind: standard
      tier: target
      wave: 1
      verifies: [FR-7.2]
      impl: "firmware/main/ble_hid.c"
      status: not_done
      xfail: true  # feature not yet implemented
      operator_report_fields:
        - "BLE scan results (use phone app)"
        - "HID service UUID visible? (yes/no)"

  # ┌─────────────────────────────────────────────────────────────┐
  # │  Manual tier — physical actions                            │
  # └─────────────────────────────────────────────────────────────┘

  manual:
    - id: TC-BTN-01
      name: "BOOT button triggers factory reset"
      kind: negative
      tier: manual
      wave: 3  # locked until waves 1 + 2 green
      verifies: [FR-6.2]
      impl: "firmware/main/button_handler.c"
      status: not_done
      needs: [button-press]
      steps:
        1: "Flash firmware with NVS layout set to US"
        2: "Hold BOOT button for 5 seconds"
        3: "Release and observe serial"
      expected:
        - "Serial shows: FACTORY_RESET: NVS cleared"
        - "Next boot uses US layout"
      operator_report_fields:
        - "serial output after button hold"
        - "did factory reset occur? (yes/no)"
        - "layout after reset"

---
# ────────────────────────── Wave state ──────────────────────────
# The AI derives these from the tests above; they are the position report.
wave_state:
  wave_1:
    total: 6
    green: 0
    red: 0
    not_done: 6
    status: "locked until JRN green"
  wave_2:
    total: 0
    status: "locked (write after wave 1 green)"
  wave_3:
    total: 0
    status: "locked (write after wave 2 green)"

# ────────────────────────── Phase ──────────────────────────
phase: commission   # derived: define → harness → commission → build → shipped
