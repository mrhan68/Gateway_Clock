# Test Plan — Smart Clock Industrial Edge Gateway
# Single source of truth for what's tested, how, and what passed.
# The AI reads this at the start of every /build session to derive the position.

# ────────────────────────── Capabilities ──────────────────────────
# What the operator can do (available: yes) vs. what cannot be done (available: no).
# A test needing available: no is marked "not done", not "failed".
capabilities:
  # --- Manual capabilities (human operator) ---
  flash-local-usb:
    what:      "Flash firmware to the ESP32 via local USB (esptool.py or idf.py)"
    available: yes
    tier:      manual

  serial-read:
    what:      "Read serial monitor output at 115200 baud via USB UART0"
    available: yes
    tier:      manual

  serial-cli-send:
    what:      "Send interactive commands via serial console (115200 baud)"
    available: yes
    tier:      manual

  button-press:
    what:      "Press BOOT, RESET, and external pushbuttons (GPIO 19, 23)"
    available: yes
    tier:      manual

  power-cycle:
    what:      "Power-cycle the device (unplug/replug 12V/24V power or USB)"
    available: yes
    tier:      manual

  sd-card-manipulation:
    what:      "Insert/remove MicroSD card, format FAT32, copy config.json"
    available: yes
    tier:      manual

  rs485-field-wiring:
    what:      "Connect A/B wires, attach 120 ohm termination resistors, connect Modbus slave"
    available: no
    consequence: "RS485 retired - Gateway uses 100% wireless mode (Wi-Fi + BLE)"

  wifi-create-ap:
    what:      "Create a WiFi AP with known SSID/password using a phone or router"
    available: yes
    tier:      manual

  ble-scan-phone:
    what:      "Scan for BLE advertisements or connect via phone app (nRF Connect)"
    available: yes
    tier:      manual

  # --- Automated capabilities (Host & CI) ---
  host-tests:
    what:      "Run pytest/unittest host test suite in CI"
    available: yes
    tier:      host

  ci-build:
    what:      "Compile firmware via GitHub Actions (espressif/idf container)"
    available: yes
    tier:      host

  # --- Limitations (without full automated testbench) ---
  rf-chamber-testing:
    what:      "Calibrate RF power in an anechoic chamber"
    available: no
    consequence: "RF receiver sensitivity tests are excluded"

  automated-power-glitch:
    what:      "Inject microsecond-level power drops"
    available: no
    consequence: "Power-loss test relies on manual power plug pulling"

---
# ────────────────────────── Debugging Agenda ──────────────────────────
# Project-side parts that have never been observed working here.
# Commissioning (/commission) burns this list to empty before software tests.
agenda:
  - part: "ESP32 DevKit Board (ESP32-S3)"
    proven: yes
    proven_by: "Flash verified & serial displays clean boot sequence without panic (2026-09-20)"

  - part: "USB-UART Serial Console (115200 baud)"
    proven: yes
    proven_by: "Serial terminal opens at 115200 baud, executes CLI commands (status, rule, ble) cleanly (2026-09-20)"

  - part: "MicroSD Card Slot (SPI Mode)"
    unproven_because: "Wiring (GPIO 14, 15, 2, 13) and FATFS mount never tested on this board"
    proven_by: "ESP32 mounts FATFS successfully and prints free storage space"

  - part: "I2C Bus (RTC DS3231 & OLED SSD1327)"
    unproven_because: "Shared I2C bus (GPIO 21, 22) address arbitration unverified"
    proven_by: "I2C scanner detects 0x3C/0x3D (OLED) and 0x68 (RTC) simultaneously"

---
# ────────────────────────── Journey Tests ──────────────────────────
# The gate for every hardware session.
# While journey tests fail, later functional tests are blocked.
journey:
  - id: JRN-01
    name: "System Boot and Alive Marker"
    kind: standard
    tier: target
    wave: 1
    verifies: [M01]
    impl: "firmware/main/main.c::app_main"
    status: passed
    steps:
      1: "Flash latest firmware to ESP32 at offset 0x10000"
      2: "Open serial monitor at 115200 baud"
      3: "Power-cycle the ESP32 (press RESET button or replug USB)"
    expected:
      - "Serial shows: [BOOT] Starting Smart Clock Edge Gateway"
      - "Serial shows: [SYS] Alive marker 1"
    prohibited:
      - "Guru Meditation Error / Kernel panic"
      - "Silent failure / no characters on serial monitor"
    operator_report_fields:
      - "First 5 lines of serial monitor output"
      - "Time from power-on to Alive marker 1 (seconds)"

  - id: JRN-02
    name: "MicroSD Card Detection & Local Config Load"
    kind: standard
    tier: target
    wave: 1
    verifies: [M15, M16]
    impl: "firmware/main/sd_logger.c"
    status: not_done
    steps:
      1: "Insert FAT32-formatted MicroSD card into SPI slot"
      2: "Ensure config.json is present in root directory"
      3: "Boot ESP32 and observe serial output"
    expected:
      - "Serial shows: [SD] FATFS mounted successfully"
      - "Serial shows: [CFG] Loaded configuration from /sdcard/config.json"
    prohibited:
      - "Serial shows: [SD] Mount failed"
      - "Watchdog timeout while mounting"
    operator_report_fields:
      - "Serial lines containing [SD] and [CFG]"
      - "Mount success? (yes/no)"

  - id: JRN-03
    name: "RS485 Bus Probe (Excluded - Wireless Mode)"
    kind: standard
    tier: target
    wave: 1
    verifies: []
    status: excluded
    reason: "RS485 physical hardware excluded in wireless Smart Home mode (BLE + Wi-Fi prioritized)"

  - id: JRN-04
    name: "Wi-Fi & MQTT Uplink Connection"
    kind: standard
    tier: target
    wave: 1
    verifies: [M03, M09]
    impl: "firmware/main/uplink.c"
    status: passed
    steps:
      1: "Provide Wi-Fi credentials in config.json or via Captive Portal"
      2: "Ensure MQTT broker is reachable"
      3: "Boot ESP32 and wait 20 seconds"
    expected:
      - "Serial shows: [WIFI] Connected, IP: 192.168.x.x"
      - "Serial shows: [MQTT] Connected to broker"
    prohibited:
      - "[MQTT] Connection refused / TLS handshake fatal error"
    operator_report_fields:
      - "IP address assigned"
      - "MQTT connection status"

