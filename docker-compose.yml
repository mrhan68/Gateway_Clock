services:
  postgres:
    image: postgres:16-alpine
    container_name: smartclock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartclock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartclock"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./website/backend
      dockerfile: Dockerfile
    container_name: smartclock-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MQTT_PORT: 1883
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/smartclock?schema=public
    ports:
      - "3000:3000"
      - "1883:1883"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./website/web-app
      dockerfile: Dockerfile
    container_name: smartclock-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
