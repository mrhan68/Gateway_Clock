services:
  - type: web
    name: smartclock-backend
    runtime: node
    rootDir: website/backend
    region: singapore
    plan: free
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma db push && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GATEWAY_KEY
        generateValue: true
      - key: MQTT_URI
        sync: false
      - key: MQTT_USER
        sync: false
      - key: MQTT_PASS
        sync: false
