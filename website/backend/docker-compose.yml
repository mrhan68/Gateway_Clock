version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartclock-db
    environment:
      POSTGRES_DB: smartclock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: smartclock-backend
    ports:
      - "3000:3000"  # REST API
      - "1883:1883"  # MQTT broker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma db push --force-reset && npm run dev"

volumes:
  pg_data:
