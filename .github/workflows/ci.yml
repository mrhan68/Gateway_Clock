name: Full-Stack CI Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-host-tests:
    name: Pytest Host Suite & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pytest==8.*' 'ruff==0.16.1'
      - run: ruff check .
      - run: pytest tests/host/ -q

  c-host-tests:
    name: C Native Host Harness & Static Assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Run C Host Tests
        run: make -C test/host

  backend-tests:
    name: Node.js Backend Tests & Broker Lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        working-directory: website/backend
        run: npm ci
      - name: Run Jest Compliance Tests
        working-directory: website/backend
        run: npm test

  frontend-check:
    name: React Vite Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        working-directory: website/web-app
        run: npm ci
      - name: ESLint Check
        working-directory: website/web-app
        run: npm run lint
      - name: Production Bundle Build
        working-directory: website/web-app
        run: npm run build

  firmware-build:
    name: ESP32-S3 Firmware Compilation (ESP-IDF v5.3.1)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.1
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    defaults:
      run:
        working-directory: firmware
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the workspace
        run: |
          git config --system --add safe.directory '*' 2>/dev/null || git config --global --add safe.directory '*' 2>/dev/null || true

      - name: Show the IDF version
        run: . $IDF_PATH/export.sh >/dev/null && idf.py --version

      - name: Decide what to build
        id: plan
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0-$(git rev-parse --short HEAD 2>/dev/null || echo 'ci')"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building firmware as $VERSION"

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh >/dev/null
          idf.py -B build -DSDKCONFIG=$PWD/build/sdkconfig \
            -DSDKCONFIG_DEFAULTS=sdkconfig.defaults \
            -DPROJECT_VER=${{ steps.plan.outputs.version }} \
            set-target esp32s3
          idf.py -B build -DSDKCONFIG=$PWD/build/sdkconfig \
            -DSDKCONFIG_DEFAULTS=sdkconfig.defaults \
            -DPROJECT_VER=${{ steps.plan.outputs.version }} \
            build

      - name: Collect artefacts
        run: |
          V="${{ steps.plan.outputs.version }}"

          cp build/smart_clock_gateway.bin "firmware_v${V}.bin"
          cp build/smart_clock_gateway.elf "firmware_v${V}.elf"

          mkdir -p coldflash/bootloader coldflash/partition_table
          cp build/flash_args coldflash/
          cp build/bootloader/bootloader.bin coldflash/bootloader/
          cp build/partition_table/partition-table.bin coldflash/partition_table/
          cp build/ota_data_initial.bin coldflash/ 2>/dev/null || true
          cp build/smart_clock_gateway.bin coldflash/
          cp build/bootloader/bootloader.bin coldflash/
          cp build/partition_table/partition-table.bin coldflash/
          cp build/sdkconfig sdkconfig.generated

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-v${{ steps.plan.outputs.version }}
          path: |
            firmware/firmware_v*.bin
            firmware/firmware_v*.elf
            firmware/sdkconfig.generated
            firmware/coldflash/
